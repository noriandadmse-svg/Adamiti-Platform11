<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>آدميتي — Landing</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    body { margin:0; font-family:'Tajawal',sans-serif; background:#111; color:#fff; display:flex; align-items:center; justify-content:center; min-height:100vh; }
    .container { text-align:center; padding:28px; max-width:760px; }
    .brand { font-size:36px; font-weight:700; color:#f5d77f; margin-bottom:8px; }
    .subtitle { color:#c9a876; margin-bottom:18px; }
    .actions { display:flex; gap:12px; justify-content:center; }
    .btn { background:#3b2a1f; color:#f5d77f; border:1px solid rgba(210,170,120,0.2); padding:12px 18px; border-radius:8px; cursor:pointer; font-size:16px; }
    .btn.secondary { background:transparent; border:1px solid rgba(255,255,255,0.06); color:#ddd; }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand">آدميتي</div>
    <div class="subtitle">Adamiti Platform — Welcome</div>
    <p>هذه صفحة الهبوط الأساسية. يرجى استخدام زر الدخول للانتقال إلى صفحة المصادقة المخصصة.</p>

    <div class="actions">
      <button class="btn" onclick="location.href='/auth'">تسجيل الدخول</button>
      <button class="btn secondary" onclick="location.href='/app'">افتح التطبيق</button>
    </div>
  </div>
</body>
</html>
