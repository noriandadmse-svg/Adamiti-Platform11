<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>آدميتي — القانون المجتمعي</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
    :root{--bg:#f5f3ef;--surface:#faf9f7;--border:#dddbd5;--text:#1e1e1c;--muted:#888780;--accent:#4a6fa5;--accent-l:#eef4fb;}
    html,body{min-height:100%;font-family:'Tajawal',system-ui,sans-serif;background:var(--bg);color:var(--text);}
    .page{max-width:640px;margin:0 auto;padding:60px 24px;}
    .badge{display:inline-block;background:var(--accent-l);color:var(--accent);font-size:12px;font-weight:600;padding:4px 14px;border-radius:20px;margin-bottom:20px;}
    h1{font-size:24px;font-weight:700;margin-bottom:14px;}
    p{font-size:14px;color:var(--muted);line-height:1.8;margin-bottom:10px;}
    a{color:var(--accent);font-size:13px;text-decoration:none;}
    a:hover{text-decoration:underline;}
  </style>
</head>
<body>
  <div class="page">
    <span class="badge">قيد الإعداد</span>
    <h1>القانون المجتمعي</h1>
    <p>هذا المحتوى قيد الصياغة حاليًا. سيتم نشر النص الكامل لـ"القانون المجتمعي" هنا قريبًا.</p>
    <br>
    <a href="/">العودة للصفحة الرئيسية</a>
  </div>
</body>
</html>
