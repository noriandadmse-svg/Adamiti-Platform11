<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>آدميتي — الرئيسية</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700&display=swap" rel="stylesheet" />

  <script type="module">
    import { firebaseConfig } from '/platform/config.js';
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc }
      from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const RoleLabels = { mufeed: 'مفيد', mustafeed: 'مستفيد' };

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    onAuthStateChanged(auth, async (user) => {
      // لا يوجد مستخدم مسجّل → ارجع لصفحة الدخول
      if (!user) { window.location.href = '/auth'; return; }

      try {
        const snap = await getDoc(doc(db, 'users', user.uid));

        // لم يكمل اختيار الدور بعد → ارجعه لصفحة الدخول لإكمال الإعداد
        if (!snap.exists() || !snap.data().role) {
          window.location.href = '/auth';
          return;
        }

        const identity = snap.data();

        document.getElementById('user-name').textContent  = identity.name  || user.displayName || 'بك';
        document.getElementById('user-avatar').src         = identity.photo || user.photoURL || '';

        const badge = document.getElementById('role-badge');
        badge.textContent = RoleLabels[identity.role] || identity.role;
        badge.className   = 'role-badge ' + (identity.role === 'mufeed' ? 'mufeed' : 'mustafeed');

        document.getElementById('loading').style.display = 'none';
        document.getElementById('content').style.display = 'block';
      } catch (e) {
        console.error('home load error:', e.code, e.message);
        document.getElementById('loading').textContent = 'تعذّر تحميل بياناتك، حاول تحديث الصفحة.';
      }
    });

    window.logout = () => signOut(auth).then(() => window.location.href = '/auth');
    window.goTo = (path) => window.location.href = path;
  </script>

  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg:#f5f3ef; --surface:#faf9f7; --border:#dddbd5;
      --text:#1e1e1c; --muted:#888780; --dim:#b4b2a9;
      --accent:#4a6fa5; --accent-l:#eef4fb; --accent-b:#c5d8ee;
      --green:#3d7a5f; --green-l:#eaf4ef; --r:12px;
    }
    html,body { min-height:100%; font-family:'Tajawal',system-ui,sans-serif; background:var(--bg); color:var(--text); }

    header { display:flex; align-items:center; justify-content:space-between; padding:20px 40px; border-bottom:0.5px solid var(--border); background:var(--surface); }
    .logo-wrap { display:flex; align-items:center; gap:10px; }
    .logo-mark { width:36px; height:36px; border-radius:10px; background:var(--accent); display:flex; align-items:center; justify-content:center; }
    .logo-mark svg { width:20px; height:20px; }
    .logo-name { font-size:17px; font-weight:700; }
    .logo-name small { font-weight:300; color:var(--muted); font-size:12px; margin-right:4px; }

    .user-box { display:flex; align-items:center; gap:12px; }
    .user-avatar { width:38px; height:38px; border-radius:50%; object-fit:cover; background:var(--accent-l); }
    .btn-logout { padding:8px 16px; border-radius:9px; border:0.5px solid var(--border); background:none; font-family:'Tajawal',sans-serif; font-size:13px; color:var(--muted); cursor:pointer; }
    .btn-logout:hover { border-color:#fca5a5; color:#b91c1c; }

    #loading { text-align:center; padding:80px 20px; color:var(--muted); font-size:14px; }
    #content { display:none; max-width:720px; margin:0 auto; padding:56px 24px; text-align:center; }

    .role-badge { display:inline-block; font-size:12px; font-weight:600; padding:3px 12px; border-radius:12px; margin-bottom:18px; }
    .role-badge.mufeed { background:var(--accent-l); color:var(--accent); border:0.5px solid var(--accent-b); }
    .role-badge.mustafeed { background:var(--green-l); color:var(--green); border:0.5px solid #b8d9c9; }

    h1 { font-size:26px; font-weight:700; margin-bottom:10px; letter-spacing:-0.4px; }
    h1 span { color:var(--accent); }
    .sub { font-size:15px; color:var(--muted); line-height:1.7; margin-bottom:40px; }

    .actions { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
    .action-card {
      background:var(--surface); border:0.5px solid var(--border); border-radius:var(--r);
      padding:26px 18px; cursor:pointer; text-align:center;
      transition:border-color .18s, box-shadow .18s, transform .18s;
    }
    .action-card:hover { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-l); transform:translateY(-2px); }
    .action-card.primary { background:var(--accent); border-color:var(--accent); }
    .action-card.primary h3, .action-card.primary p { color:#fff; }
    .action-icon { font-size:26px; margin-bottom:10px; }
    .action-card h3 { font-size:15px; font-weight:700; margin-bottom:4px; }
    .action-card p { font-size:12px; color:var(--muted); line-height:1.5; }

    @media (max-width:640px) {
      header { padding:16px 20px; }
      .actions { grid-template-columns:1fr; }
    }
  </style>
</head>
<body>

  <header>
    <div class="logo-wrap">
      <div class="logo-mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M12 2v3M12 19v3M2 12h3M19 12h3"/>
          <path d="M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/>
        </svg>
      </div>
      <div class="logo-name">آدميتي <small>Platform</small></div>
    </div>
    <div class="user-box">
      <img class="user-avatar" id="user-avatar" alt="" />
      <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
    </div>
  </header>

  <div id="loading">جارٍ تحميل حسابك...</div>

  <div id="content">
    <span class="role-badge" id="role-badge"></span>
    <h1>مرحباً <span id="user-name"></span> 👋</h1>
    <p class="sub">وصلت إلى المساحة الرئيسية في آدميتي.<br>اختر من أين تبدأ رحلتك اليوم.</p>

    <div class="actions">
      <div class="action-card primary" onclick="goTo('/dashboard')">
        <div class="action-icon">🏠</div>
        <h3>حسابي</h3>
        <p>لوحة التحكم الخاصة بك</p>
      </div>
      <div class="action-card" onclick="goTo('/services')">
        <div class="action-icon">🧩</div>
        <h3>الخدمات</h3>
        <p>استكشف أو أضِف خدمة</p>
      </div>
      <div class="action-card" onclick="goTo('/profile')">
        <div class="action-icon">👤</div>
        <h3>الملف الشخصي</h3>
        <p>عدّل بياناتك ودورك</p>
      </div>
    </div>
  </div>

</body>
</html>
