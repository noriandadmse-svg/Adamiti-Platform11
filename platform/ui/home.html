<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>آدميتي — الصفحة الرئيسية</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet" />

  <script type="module">
    import { firebaseConfig } from '/platform/config.js';
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, writeBatch } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    // محاولة المطالبة بالأدمن الأول — تعمل لأي مستخدم (جديد أو عائد)
    // تنجح مرة واحدة فقط بالضبط لأول من يمرّ من هنا بعد نشر النظام؛ تفشل بصمت لغيره
    async function tryClaimFirstAdmin(uid) {
      try {
        const batch = writeBatch(db);
        batch.update(doc(db, 'meta', 'bootstrap'), { adminAssigned: true });
        batch.update(doc(db, 'users', uid), { isAdmin: true });
        await batch.commit();
        return true;
      } catch (e) {
        return false; // متوقع تمامًا لأي حد غير الأول
      }
    }

    window.enterSetup = async (uid) => {
      // نعلّم "شفتها" فقط لحظة الضغط الفعلي، مو فور تحميل الصفحة
      await updateDoc(doc(db, 'users', uid), { setupCardSeen: true }).catch(() => {});
      window.location.href = '/profile';
    };

    onAuthStateChanged(auth, async (user) => {
      if (!user) { window.location.href = '/auth'; return; }

      try {
        const ref  = doc(db, 'users', user.uid);
        const snap = await getDoc(ref);

        if (!snap.exists() || !snap.data().role) {
          window.location.href = '/auth';
          return;
        }
        let identity = snap.data();

        document.getElementById('user-name').textContent = identity.name || user.displayName || 'بك';

        // بطاقة "تهيئة الحساب" — تُعرض لحد ما يُضغط عليها فعليًا (لا تختفي بمجرد المشاهدة)
        if (!identity.setupCardSeen) {
          const card = document.getElementById('card-setup');
          card.style.display = 'flex';
          card.setAttribute('onclick', `enterSetup('${user.uid}')`);
        }

        // محاولة المطالبة بالأدمن الأول، ثم إعادة قراءة الحالة الفعلية بعدها
        if (identity.isAdmin !== true) {
          const claimed = await tryClaimFirstAdmin(user.uid);
          if (claimed) identity = { ...identity, isAdmin: true };
        }
        if (identity.isAdmin === true) {
          document.getElementById('card-system').style.display = 'flex';
        }

        document.getElementById('loading').style.display = 'none';
        document.getElementById('page').style.display = 'block';
      } catch (e) {
        console.error('home load error:', e.code, e.message);
        document.getElementById('loading').textContent = 'تعذّر تحميل بياناتك، حاول تحديث الصفحة.';
      }
    });

    window.logout = () => signOut(auth).then(() => window.location.href = '/');
    window.goTo   = (path) => window.location.href = path;
  </script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    html,body {
      min-height:100%; font-family:'Tajawal',sans-serif;
      display:flex; align-items:center; justify-content:center;
      padding:clamp(16px, 4vw, 48px);
      background-color:#e9dcc0;
      background-image:
        radial-gradient(circle at 15% 15%, rgba(150,120,70,0.12) 0, transparent 40%),
        radial-gradient(circle at 85% 25%, rgba(150,120,70,0.1) 0, transparent 45%),
        radial-gradient(circle at 50% 90%, rgba(150,120,70,0.1) 0, transparent 50%),
        repeating-radial-gradient(circle at 50% 50%, rgba(120,95,55,0.025) 0, rgba(120,95,55,0.025) 1px, transparent 2px, transparent 6px);
    }
    #loading { color:#a3907a; font-size:13px; }

    .page { display:none; width:clamp(300px, 92vw, 460px); }

    .book {
      padding:clamp(32px, 6vw, 40px) clamp(20px, 6vw, 40px) clamp(24px, 4vw, 32px);
      position:relative;
      background-color:#f3e9d2;
      background-image:
        radial-gradient(circle at 15% 20%, rgba(150,120,70,0.08) 0, transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(150,120,70,0.1) 0, transparent 40%),
        radial-gradient(circle at 60% 15%, rgba(150,120,70,0.06) 0, transparent 30%),
        repeating-radial-gradient(circle at 50% 50%, rgba(120,95,55,0.03) 0, rgba(120,95,55,0.03) 1px, transparent 2px, transparent 5px);
      box-shadow: inset 0 0 60px rgba(120,90,50,0.15), 0 25px 60px rgba(0,0,0,0.5);
      border-radius:2px;
    }

    .top-row { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
    .brand { font-size:13px; font-weight:700; color:#3b2a1f; }
    .btn-logout { background:none; border:none; font-family:'Tajawal',sans-serif; font-size:11px; color:#8a7259; cursor:pointer; }
    .btn-logout:hover { color:#3b2a1f; }

    .header { text-align:center; margin-bottom:8px; }
    h1 { font-size:22px; font-weight:700; color:#3b2a1f; margin-bottom:6px; }
    .sub { font-size:13px; color:#7a6650; line-height:1.8; margin-bottom:8px; }

    .divider-orn { display:flex; align-items:center; justify-content:center; gap:10px; margin:22px 0 24px; }
    .divider-orn .line { width:36px; height:1px; background:rgba(90,65,35,0.3); }
    .divider-orn .mark { color:#8a6f45; font-size:12px; }

    .cards { display:flex; flex-direction:column; gap:12px; }
    .card {
      display:none; align-items:center; gap:14px;
      border:1.3px dashed rgba(90,65,35,0.4);
      padding:16px 18px;
      cursor:pointer;
      transition:background .15s, border-color .15s;
    }
    .card:hover { background:rgba(90,65,35,0.05); border-color:#8a6f45; }
    .card .ic { font-size:22px; filter:sepia(1) saturate(1.2); flex-shrink:0; }
    .card .txt h3 { font-size:14px; font-weight:700; color:#3b2a1f; margin-bottom:3px; }
    .card .txt p { font-size:11px; color:#8a7259; line-height:1.5; }

    .footnote { text-align:center; font-size:10.5px; color:#a3907a; margin-top:24px; }
  </style>
</head>
<body>

  <div id="loading">جارٍ تحميل حسابك...</div>

  <div class="page" id="page">
    <div class="book">
      <div class="top-row">
        <span class="brand">آدميتي</span>
        <button class="btn-logout" onclick="logout()">تسجيل الخروج</button>
      </div>

      <div class="header">
        <h1>مرحباً <span id="user-name"></span> 👋</h1>
        <p class="sub">اختر من أين تبدأ رحلتك اليوم.</p>
      </div>

      <div class="divider-orn"><div class="line"></div><span class="mark">✦</span><div class="line"></div></div>

      <div class="cards">
        <!-- نافذة العرض — تظهر دائمًا للجميع -->
        <div class="card" style="display:flex" onclick="goTo('/community')">
          <div class="ic">🖼️</div>
          <div class="txt"><h3>نافذة العرض</h3><p>استعرض ما تقدّمه المنصة والمجتمع</p></div>
        </div>

        <!-- حاويتي — دائمة الظهور، دخول مباشر بغض النظر عن حالة التهيئة -->
        <div class="card" style="display:flex" onclick="goTo('/dashboard')">
          <div class="ic">📂</div>
          <div class="txt"><h3>حاويتي</h3><p>ادخل لحسابك مباشرة في أي وقت</p></div>
        </div>

        <!-- تهيئة الحساب — تُعرض حتى يُضغط عليها فعليًا -->
        <div class="card" id="card-setup">
          <div class="ic">🧭</div>
          <div class="txt"><h3>تهيئة حسابك</h3><p>جهّز حاويتك الخاصة قبل ما تبدأ</p></div>
        </div>

        <!-- الدخول للنظام — أدمن بس -->
        <div class="card" id="card-system" onclick="goTo('/admin')">
          <div class="ic">🗝️</div>
          <div class="txt"><h3>الدخول للنظام</h3><p>أدوات الإدارة والبناء المركزي</p></div>
        </div>
      </div>

      <div class="footnote">آدميتي — منصة ومجتمع</div>
    </div>
  </div>

</body>
</html>
